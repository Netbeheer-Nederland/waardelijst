site:
  url: https://www.ucaiug.io/prof-ap-cim
  start_page: ROOT::index.adoc
content:
  sources:
    - url: ''
      branches: HEAD
      start_paths: docs-adoc/*
asciidoc:
  attributes:
    page-pagination: ''
    experimental: ''
    kroki-fetch-diagram: true
    kroki-default-format: svg@
    kroki-server-url: http://fruit.ritger.nl:9000
  extensions:
    - asciidoctor-kroki
output:
  clean: true
  dir: docs
ui:
  bundle:
    url: https://github.com/cimug-org/antora-ui-cimug-spec/releases/download/v0.1.0/ui-bundle.zip
